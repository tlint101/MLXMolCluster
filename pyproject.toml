[project]
name = "mlx-mol-cluster"
version = "0.2.0"
description = "Clustering molecules using Apple Silicon GPU"
authors = [{ name = "Tony Eight Lin" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx (>=0.31.0)",
    "numpy (>=2.4.2)",
    "pandas (>=3.0.1)",
    "seaborn (>=0.13.2)",
    "rdkit (>=2025.9.5)",
]

[tool.poetry]
packages = [{ include = "mlx_cluster" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1)",
    "ipywidgets (>=8.1.8)",
    "bblean (>=0.10.1)",
    "mols2grid (>=2.2.0)",
    "scikit-learn (>=1.8.0)"
]
